[project]
name = "music-tracks"
version = "0.1.0"
description = "Local stem separation and practice platform"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.163.1",
  "uvicorn[standard]",
  "python-multipart",
  "sqlalchemy>=2.0",
  "demucs==4.1.0",
  "torch==2.14.1",
  "beat-this==1.1.0",
  "librosa==1.0.1",
  "numpy>=2",
  "scipy",
  "soundfile==0.14.0",
  "soxr",
  "yt-dlp[default]",
  "mutagen",
  "python-stretch==0.3.1",
  "pillow",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The import package is `app/` next to this file; it is installed in editable mode by
# `uv sync`, so `uv run --project backend python -m app.launcher` works from the repo root.
module-name = "app"
module-root = ""

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.uv]
# Supported platforms (Intel macOS is excluded: demucs pins torch<2.3 there).
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# Windows: PyPI's win_amd64 torch wheel is CPU-only, so take torch from the official PyTorch
# CUDA index there (cu126: the widest GPU/driver support among the CUDA builds of 2.14.1;
# the wheel bundles the CUDA runtime, ~2 GB, and also runs on machines without a GPU).
# Linux x86_64 keeps PyPI's torch (already a CUDA build); macOS uses PyPI's (MPS).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: uses real models"]
